name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  GH_PAGES_BASE: /student-progress-tracker
  PREVIEW_DOMAIN: https://leapx-pune.github.io

jobs:
  deploy-preview:
    name: Deploy PR Preview
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Check CI status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const failed = checks.check_runs.filter(c => c.conclusion === 'failure');
            if (failed.length > 0) {
              core.setFailed(`CI checks failed: ${failed.map(c => c.name).join(', ')}`);
            }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: >
          node scripts/build.js
          --base ${{ env.GH_PAGES_BASE }}/pr-preview/${{ github.event.number }}/
          --env staging
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-preview/${{ github.event.number }}
          keep_files: false
      - uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `${{ env.PREVIEW_DOMAIN }}${{ env.GH_PAGES_BASE }}/pr-preview/${{ github.event.number }}/#/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Deployed\n\n${previewUrl}`
            });
