<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades - Student Progress Tracker</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Grade summary stat badges */
        .grade-stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .grade-stat-badge {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem 1.25rem;
            text-align: center;
            box-shadow: var(--shadow-premium);
        }

        .grade-stat-value {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        .grade-stat-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            font-weight: 500;
        }

        /* Chart containers */
        .chart-container-line {
            width: 100%;
            height: 280px;
        }

        .chart-container-line canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .chart-container-bar {
            width: 100%;
            height: 200px;
        }

        .chart-container-bar canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .chart-container-doughnut {
            width: 100%;
            height: 220px;
        }

        .chart-container-doughnut canvas {
            width: 100% !important;
            height: 100% !important;
        }

        @media (max-width: 640px) {
            .grade-stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">

        <!-- Top Navbar -->
        <nav class="top-navbar">
            <div class="nav-left">
                <div class="logo-box" onclick="window.location.href='index.html'" title="Back to Home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                        <rect x="8" y="8" width="8" height="8" rx="1" ry="1"></rect>
                    </svg>
                </div>
            </div>

            <div class="nav-center">
                <a href="dashboard.html" class="nav-pill">Dashboard</a>
                <a href="#" class="nav-pill">Speaking</a>
                <a href="#" class="nav-pill">Progress</a>
                <a href="grades.html" class="nav-pill active">Grades</a>
            </div>

            <div class="nav-right">
                <button class="nav-icon-btn" aria-label="Search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <button class="nav-icon-btn" aria-label="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="badge-dot"></span>
                </button>
                <button class="nav-icon-btn user-avatar-btn" aria-label="Profile">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="User Avatar">
                </button>
            </div>
        </nav>

        <!-- Dashboard Body -->
        <div class="dashboard-body">

            <!-- Sidebar -->
            <aside class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-item" aria-label="Home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </a>
                <a href="#" class="sidebar-item" aria-label="Explore">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                </a>
                <a href="#" class="sidebar-item" aria-label="Calendar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </a>
                <a href="grades.html" class="sidebar-item active" aria-label="Grades">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </a>
                <a href="#" class="sidebar-item" aria-label="Messages">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </a>
                <a href="#" class="sidebar-item" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </a>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <h1 class="dashboard-title">Grades</h1>

                <!-- Grade Summary Stat Badges -->
                <div class="grade-stats-bar">
                    <div class="grade-stat-badge">
                        <div class="grade-stat-value" style="color: #4F46E5;">87.8%</div>
                        <div class="grade-stat-label">Overall Average</div>
                    </div>
                    <div class="grade-stat-badge">
                        <div class="grade-stat-value" style="color: #22C55E;">98%</div>
                        <div class="grade-stat-label">Highest Score</div>
                    </div>
                    <div class="grade-stat-badge">
                        <div class="grade-stat-value" style="color: #F59E0B;">76%</div>
                        <div class="grade-stat-label">Lowest Score</div>
                    </div>
                    <div class="grade-stat-badge">
                        <div class="grade-stat-value" style="color: #10B981;">5</div>
                        <div class="grade-stat-label">Quizzes Taken</div>
                    </div>
                </div>

                <!-- Full-width: Weekly Progress Line Chart -->
                <section class="premium-card" style="margin-bottom: 1.5rem;">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Weekly Progress</h2>
                            <p class="card-subtitle">Assignments completed and attendance over 6 weeks.</p>
                        </div>
                        <button class="action-btn-circle" aria-label="Expand">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <polyline points="9 21 3 21 3 15"></polyline>
                                <line x1="21" y1="3" x2="14" y2="10"></line>
                                <line x1="3" y1="21" x2="10" y2="14"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="chart-container-line">
                        <canvas id="gradesLineChart"></canvas>
                    </div>
                </section>

                <!-- Bottom Row: Quiz Scores + Grade Distribution -->
                <div class="stats-row">
                    <section class="premium-card">
                        <div class="card-header">
                            <div>
                                <h2 class="card-title">Quiz Scores</h2>
                                <p class="card-subtitle">Your score per quiz.</p>
                            </div>
                        </div>
                        <div class="chart-container-bar">
                            <canvas id="gradesBarChart"></canvas>
                        </div>
                    </section>

                    <section class="premium-card">
                        <div class="card-header">
                            <div>
                                <h2 class="card-title">Grade Distribution</h2>
                                <p class="card-subtitle">Class-wide grade breakdown.</p>
                            </div>
                        </div>
                        <div class="chart-container-doughnut">
                            <canvas id="gradesDoughnutChart"></canvas>
                        </div>
                    </section>
                </div>

            </main>
        </div>
    </div>

    <script>
        // Reuse chart configs from chart_script.js data — same data, new canvas IDs

        // --- Bar Chart (Quiz Scores) ---
        new Chart(document.getElementById('gradesBarChart'), {
            type: 'bar',
            data: {
                labels: ['Quiz 1', 'Quiz 2', 'Quiz 3', 'Quiz 4', 'Quiz 5'],
                datasets: [{
                    label: 'Score (%)',
                    data: [85, 92, 76, 98, 88],
                    backgroundColor: ['#4F46E5', '#3B82F6', '#10B981', '#F59E0B', '#EF4444'],
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    title: { display: false },
                    tooltip: { callbacks: { label: ctx => `Score: ${ctx.raw}%` } }
                },
                scales: {
                    y: {
                        beginAtZero: true, max: 100,
                        ticks: { font: { size: 11 }, callback: v => v + '%' },
                        title: { display: false }
                    },
                    x: {
                        ticks: { font: { size: 11 }, maxRotation: 0, minRotation: 0 },
                        title: { display: false }
                    }
                }
            }
        });

        // --- Doughnut Chart (Grade Distribution) ---
        new Chart(document.getElementById('gradesDoughnutChart'), {
            type: 'doughnut',
            data: {
                labels: ['Grade A', 'Grade B', 'Grade C', 'Grade D', 'Grade F'],
                datasets: [{
                    data: [40, 30, 15, 10, 5],
                    backgroundColor: ['#22C55E', '#3B82F6', '#FACC15', '#F97316', '#EF4444'],
                    borderColor: '#ffffff',
                    borderWidth: 3,
                    hoverOffset: 15
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '65%',
                layout: { padding: 10 },
                plugins: {
                    title: { display: false },
                    legend: {
                        position: 'right', align: 'center',
                        labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 12, padding: 20, font: { size: 12 } }
                    },
                    tooltip: {
                        callbacks: {
                            label(ctx) {
                                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                const pct = ((ctx.raw / total) * 100).toFixed(1);
                                return `${ctx.label}: ${ctx.raw} Students (${pct}%)`;
                            }
                        }
                    }
                }
            }
        });

        // --- Line Chart (Weekly Progress) ---
        new Chart(document.getElementById('gradesLineChart'), {
            type: 'line',
            data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6'],
                datasets: [
                    {
                        label: 'Assignments Completed',
                        data: [60, 68, 75, 82, 90, 96],
                        borderColor: '#4F46E5',
                        backgroundColor: 'rgba(79,70,229,0.15)',
                        borderWidth: 3,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBackgroundColor: '#4F46E5',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Attendance',
                        data: [90, 92, 88, 94, 96, 98],
                        borderColor: '#10B981',
                        backgroundColor: 'rgba(16,185,129,0.15)',
                        borderWidth: 3,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBackgroundColor: '#10B981',
                        tension: 0.4,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { color: '#374151', font: { size: 13, weight: 'bold' } } },
                    tooltip: {
                        backgroundColor: '#111827', titleColor: '#fff', bodyColor: '#fff', padding: 12,
                        callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}%` }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true, max: 100,
                        ticks: { callback: v => v + '%' },
                        title: { display: true, text: 'Progress (%)' }
                    },
                    x: { title: { display: true, text: 'Weeks' } }
                }
            }
        });
    </script>
</body>
</html>
